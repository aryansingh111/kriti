<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Kriti — design your resume first, with a live PDF preview. 100 ATS-friendly templates, clickable links, drag-to-adjust spacing. Free and 100% private."
    />
    <title>Kriti — Resume Studio</title>
    <style>
      /* splash shown on a full reload until the app is ready: the logo stays still while a shine sweeps across it */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; transition: opacity 0.3s ease, visibility 0.3s; }
      html.dark #splash { background: #08120d; }
      #splash .logo { width: 96px; height: 96px; background-color: #0b7244; background-image: linear-gradient(110deg, transparent 38%, rgba(255, 255, 255, 0.85) 50%, transparent 62%); background-size: 300% 100%; background-repeat: no-repeat; background-position: 160% 0; -webkit-mask: url(/logo.png) center / contain no-repeat; mask: url(/logo.png) center / contain no-repeat; animation: sp-fade 0.25s ease both, sp-shine 1.5s ease-in-out infinite; }
      html.dark #splash .logo { background-color: #3fcf84; }
      #splash.done { opacity: 0; visibility: hidden; }
      @keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sp-shine { 0% { background-position: 160% 0; } 70%, 100% { background-position: -60% 0; } }
      @media (prefers-reduced-motion: reduce) { #splash .logo { animation-duration: 0.01ms; } #splash { transition-duration: 0.01ms; } }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('kriti:theme') || localStorage.getItem('vitae:theme') || '"system"')
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="logo"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
